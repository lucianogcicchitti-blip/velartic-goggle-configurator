<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELARTIC | Design your goggles</title>
<style>
:root{--navy:#0F2340;--gold:#B8944A;--goldl:#F3E9D2;--orange:#F0A868;--sky:#7FBDE3;--skyl:#EAF4FB;--line:#E3E8EF;--mute:#5C6B80}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--navy);background:#fff}
h1,h2,.brand{font-family:Georgia,"Times New Roman",serif;font-weight:600}
h2{font-size:28px;margin:0 0 4px}
h3{font-size:14px;margin:26px 0 10px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
header{border-bottom:1px solid var(--line)}
.hd{max-width:1120px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-size:20px;letter-spacing:.3em;display:flex;align-items:center;gap:12px}
.brand:before{content:"";width:22px;height:2px;background:var(--gold)}
nav{display:flex;gap:20px}
.st{background:none;border:0;color:var(--mute);display:flex;gap:8px;align-items:center;padding:4px 0}
.st b{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px}
.st.on{color:var(--navy);font-weight:600;background:none!important}
.st.on b{background:var(--navy);border-color:var(--navy);color:#fff}
.st.ok b{background:var(--gold);border-color:var(--gold);color:#fff}
main{max-width:1120px;margin:0 auto;padding:28px 24px 40px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:44px}
.stage{position:sticky;top:20px;align-self:start}
.view{background:linear-gradient(180deg,var(--skyl),#fff);border:1px solid var(--line);border-radius:14px;padding:14px}
.view svg{width:100%;height:auto;display:block}
.bd{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px}
.bd div{display:flex;justify-content:space-between;padding:3px 0}
.bd .mu{color:var(--mute)}
.bd .of{color:#A35A1B}
.bd .tt{border-top:1px solid var(--gold);margin-top:8px;padding-top:10px;font-weight:600;font-size:18px}
.sub{color:var(--mute);margin:0}
.models{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mod,.seg button,.in,.file{border:1.5px solid var(--line);border-radius:10px;background:#fff}
.mod{text-align:left;padding:14px;display:flex;flex-direction:column;gap:4px}
.mod span{color:var(--mute);font-size:13px}
.mod em{font-style:normal;color:var(--gold);font-weight:600}
.on{border-color:var(--navy)!important;background:var(--skyl)!important}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:9px 14px;text-align:left;display:flex;flex-direction:column}
.seg small{color:var(--mute);font-size:12px}
.seg em{font-style:normal;color:#A35A1B}
.sws{display:flex;gap:14px;flex-wrap:wrap}
.sw{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mute);padding:0;width:64px}
.sw i{width:38px;height:38px;border-radius:50%;border:1px solid rgba(15,35,64,.25);box-shadow:0 0 0 3px #fff,0 0 0 4.5px transparent}
.sw.on{color:var(--navy);background:none!important}
.sw.on i{box-shadow:0 0 0 3px #fff,0 0 0 4.5px var(--navy)}
.sw:disabled{opacity:.35;cursor:not-allowed}
.inc{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:14px}
.inc li:before{content:"\2713";color:var(--gold);margin-right:8px;font-weight:700}
.in{width:100%;padding:11px 14px;margin-top:12px}
.in.bad{border-color:#D9534F}
.file{display:block;padding:11px 14px;margin-top:12px;font-size:14px;color:var(--mute)}
.hint{font-size:13px;color:var(--mute);margin:10px 0 0}
dl{margin:18px 0 0;font-size:14px}
dl div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
dt{color:var(--mute)}dd{margin:0;font-weight:600;text-align:right}
.qty{display:flex;align-items:center;gap:14px;margin-top:6px}
.qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:18px;line-height:1}
.note{background:var(--goldl);border-radius:10px;padding:12px 14px;font-size:13.5px;margin-top:18px}
.tag{display:inline-block;background:#FDEBDD;color:#A35A1B;border-radius:20px;padding:2px 10px;font-size:12px;margin-top:10px}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);margin-top:30px;padding:14px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar small{display:block;color:var(--mute);font-size:12px}
.bar b{font-size:20px}
.btn{border-radius:10px;padding:11px 20px;border:1.5px solid var(--navy);background:#fff;font-weight:600}
.btn.p{background:var(--navy);color:#fff}
.trk{list-style:none;padding:0;margin:22px 0 0}
.trk li{display:flex;gap:14px;padding-bottom:20px;position:relative;color:var(--mute)}
.trk li:before{content:"";flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:#fff;margin-top:4px;z-index:1}
.trk li:not(:last-child):after{content:"";position:absolute;left:6px;top:20px;bottom:0;width:2px;background:var(--line)}
.trk li.d:before{background:var(--gold);border-color:var(--gold)}
.trk li.n:before{border-color:var(--orange);background:var(--orange)}
.trk li.d,.trk li.n{color:var(--navy)}
.trk small{display:block;color:var(--mute)}
footer{max-width:1120px;margin:0 auto;padding:0 24px 32px;color:var(--mute);font-size:12px}
@media(max-width:860px){main{grid-template-columns:1fr;gap:24px}.stage{position:static}nav{gap:12px}.st span{display:none}.st.on span{display:inline}}
@media(max-width:480px){.models,.inc{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="hd"><div class="brand">VELARTIC</div><nav id="nav"></nav></div></header>
<main>
  <section class="stage"><div class="view" id="pv" role="img" aria-label="Live preview of your goggles"></div><div class="bd" id="bd"></div></section>
  <section id="panel"></section>
</main>
<footer>Prototype for the VELARTIC case study. Prices are illustrative and no payment is processed.</footer>
<script>
/* ---------- Editable configuration ---------- */
const CUR='\u20AC', OFFER={on:true,pct:10,label:'Pre-season offer'};
const BASE={framed:{n:'Framed',p:119,d:'Injection-molded frame around the lens. Structured fit, classic look.'},
            frameless:{n:'Frameless',p:139,d:'Open-edge lens held by slim clips. Wider view, lighter feel.'}};
const SIZES=[{id:'M',n:'M',d:'Standard fit'},{id:'L',n:'L',d:'Wider fit'}];
const FRAME=[{id:'navy',n:'Navy',c:'#0F2340'},{id:'pearl',n:'Pearl',c:'#F3F5F8'},{id:'gold',n:'Gold',c:'#B8944A'},{id:'glacier',n:'Glacier',c:'#7FBDE3'}];
const TINT=[{id:'smoke',n:'Smoke',c:'#2F3A4C',o:.62},{id:'amber',n:'Amber',c:'#E39A2D',o:.55},{id:'rose',n:'Rose',c:'#D9788F',o:.5},{id:'ice',n:'Ice blue',c:'#4FA3D9',o:.5}];
const FIN=[{id:'none',n:'Standard',d:'Tint only',p:0},{id:'mirror',n:'Mirror coating',d:'Reflective finish',p:24},{id:'pol',n:'Polarized film',d:'Reduces glare',p:32}];
const STRAP=[{id:'navy',n:'Navy',c:'#0F2340'},{id:'sky',n:'Sky',c:'#7FBDE3'},{id:'orange',n:'Orange',c:'#F0A868'},{id:'gold',n:'Gold',c:'#B8944A'}]; /* add a:false to hide an option as sold out */
const PERS=[{id:'none',n:'None',p:0},{id:'logo',n:'Logo',p:15},{id:'company',n:'Company name',p:12},{id:'name',n:'Personal name',p:10},{id:'graphic',n:'Graphic',p:12}];
const GFX=[{id:'peak',n:'Peak'},{id:'snow',n:'Snowflake'},{id:'sun',n:'Sun'},{id:'star',n:'Star'}];
/* ---------- State ---------- */
const init=()=>({step:0,base:'framed',size:'M',frame:'navy',tint:'smoke',fin:'none',strap:'navy',pers:'none',text:'',gfx:'peak',logo:null,logoName:'',qty:1,done:false,ord:''});
let s=init();
const $=q=>document.querySelector(q), find=(a,id)=>a.find(x=>x.id==id);
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>CUR+n.toFixed(2), tag=p=>p?`<em>+${CUR}${p}</em>`:'';
const lum=h=>{const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255};
/* ---------- Price ---------- */
function price(){const L=[[BASE[s.base].n+' goggles, size '+s.size,BASE[s.base].p]];
  const f=find(FIN,s.fin);if(f.p)L.push([f.n,f.p]);
  const p=find(PERS,s.pers);if(p.p)L.push(['Strap: '+p.n.toLowerCase(),p.p]);
  const unit=L.reduce((a,l)=>a+l[1],0),sub=unit*s.qty,disc=OFFER.on?sub*OFFER.pct/100:0;
  return{L,unit,sub,disc,total:sub-disc}}
function drawPrice(){const P=price();
  $('#bd').innerHTML=P.L.map(l=>`<div><span>${l[0]}</span><span>${money(l[1])}</span></div>`).join('')
   +(s.qty>1?`<div class=mu><span>Quantity</span><span>x ${s.qty}</span></div>`:'')
   +(OFFER.on?`<div class=of><span>${OFFER.label} (-${OFFER.pct}%)</span><span>-${money(P.disc)}</span></div>`:'')
   +`<div class=tt><span>Total</span><span>${money(P.total)}</span></div>`;
  document.querySelectorAll('.tv').forEach(e=>e.textContent=money(P.total))}
/* ---------- Preview ---------- */
const F='M60 70C60 38 90 28 130 28H270C310 28 340 38 340 70V128C340 165 315 178 285 178H232C218 178 212 150 200 150C188 150 182 178 168 178H115C85 178 60 165 60 128Z';
const LN='M74 72C74 48 96 42 130 42H270C304 42 326 48 326 72V126C326 154 308 164 285 164H238C226 164 218 140 200 140C182 140 174 164 162 164H115C92 164 74 154 74 126Z';
const GL={peak:'<path d="M-13 9L-4-8L1 1L5-4L13 9Z"/>',snow:'<path d="M0-12V12M-10.4-6L10.4 6M-10.4 6L10.4-6" fill="none" stroke-width="1.8"/>',
 sun:'<circle r="4.5"/><path d="M0-12V-8M0 8V12M-12 0H-8M8 0H12M-8.5-8.5L-6-6M6 6L8.5 8.5M-8.5 8.5L-6 6M6-6L8.5-8.5" fill="none" stroke-width="1.8"/>',
 star:'<polygon points="0,-12 3.5,-4 12,-3.5 5.5,2 7.5,10.5 0,6 -7.5,10.5 -5.5,2 -12,-3.5 -3.5,-4"/>'};
function strapArt(sc,tc){
  if(s.pers=='logo')return s.logo?`<image href="${s.logo}" x="165" y="230" width="70" height="32" preserveAspectRatio="xMidYMid meet"/>`
    :`<g fill="none" stroke="${tc}" stroke-width="1.6" opacity=".8"><circle cx="200" cy="246" r="14"/><path d="M190 253L198 241L203 248L206 244L210 253Z" fill="${tc}"/></g>`;
  if(s.pers=='company'||s.pers=='name'){const e=!s.text.trim(),t=(e?(s.pers=='name'?'Your name':'Your company'):s.text).toUpperCase(),fs=t.length<=10?22:t.length<=15?18:14;
    return`<text x="200" y="${246+fs*.35}" text-anchor="middle" font-family="Georgia,serif" font-size="${fs}" letter-spacing="3" fill="${tc}" opacity="${e?.5:1}">${esc(t)}</text>`}
  if(s.pers=='graphic')return[60,130,200,270,340].map(x=>`<g transform="translate(${x} 246)" fill="${tc}" stroke="${tc}">${GL[s.gfx]}</g>`).join('');
  return''}
function svg(){const fr=find(FRAME,s.frame),t=find(TINT,s.tint),st=find(STRAP,s.strap),fin=s.fin,tc=lum(st.c)<.55?'#fff':'#0F2340',
  sc=s.size=='M'?.93:1.04,framed=s.base=='framed',LP=framed?LN:F,line='rgba(15,35,64,.3)';
  return`<svg viewBox="0 0 400 290" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="lc"><path d="${LP}"/></clipPath>
  <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DDEEF9"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <linearGradient id="mr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".45" stop-color="#7FBDE3" stop-opacity=".45"/><stop offset=".72" stop-color="#B8944A" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity=".6"/></linearGradient>
  <pattern id="pl" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 3H6" stroke="#0F2340" stroke-opacity=".2"/></pattern></defs>
  <g transform="translate(200 103) scale(${sc}) translate(-200 -103)">
   <rect x="8" y="74" width="60" height="50" rx="10" fill="${st.c}" stroke="${line}"/><rect x="332" y="74" width="60" height="50" rx="10" fill="${st.c}" stroke="${line}"/>
   ${framed?`<path d="${F}" fill="${fr.c}" stroke="${line}" stroke-width="1.5"/>`:''}
   <g clip-path="url(#lc)"><rect x="40" y="20" width="320" height="170" fill="url(#sk)"/>
    <path d="M60 170L130 95L170 135L225 68L285 140L320 112L345 140V185H60Z" fill="#C9DDEC"/>
    <rect x="40" y="20" width="320" height="170" fill="${t.c}" opacity="${t.o}"/>
    ${fin=='mirror'?'<rect x="40" y="20" width="320" height="170" fill="url(#mr)"/>':''}${fin=='pol'?'<rect x="40" y="20" width="320" height="170" fill="url(#pl)"/><rect x="40" y="20" width="320" height="170" fill="#0F2340" opacity=".12"/>':''}
    <path d="M95 40L150 40L112 170L78 170Z" fill="#fff" opacity=".22"/></g>
   <path d="${LP}" fill="none" stroke="${framed?line:'rgba(15,35,64,.55)'}" stroke-width="${framed?1.2:1.8}"/>
   ${framed?'':`<g fill="${fr.c}" stroke="${line}"><rect x="50" y="78" width="20" height="44" rx="6"/><rect x="330" y="78" width="20" height="44" rx="6"/><rect x="180" y="21" width="40" height="13" rx="6"/></g>`}
  </g>
  <rect x="24" y="224" width="352" height="46" rx="8" fill="${st.c}" stroke="${line}"/>
  <path d="M30 230H370M30 264H370" stroke="${tc}" stroke-opacity=".4" stroke-dasharray="3 4"/>${strapArt(sc,tc)}</svg>`}
function update(){$('#pv').innerHTML=svg();drawPrice()}
/* ---------- Panels ---------- */
const sw=(k,a,cur)=>`<div class=sws>`+a.map(o=>`<button class="sw${o.id==cur?' on':''}" data-k=${k} data-v=${o.id}${o.a===false?' disabled':''}><i style="background:${o.c}"></i><span>${o.n}${o.a===false?' (sold out)':''}</span></button>`).join('')+`</div>`;
const seg=(k,a,cur)=>`<div class=seg>`+a.map(o=>`<button class="${o.id==cur?'on':''}" data-k=${k} data-v=${o.id}><b>${o.n}</b>${o.d||o.p?`<small>${o.d||''} ${tag(o.p)}</small>`:''}</button>`).join('')+`</div>`;
const frameLbl=()=>s.base=='framed'?'Frame color':'Clip color';
function persVal(){return{none:'None',logo:'Logo'+(s.logoName?' ('+esc(s.logoName)+')':''),company:'Company: '+esc(s.text||'to be added'),name:'Name: '+esc(s.text||'to be added'),graphic:'Graphic: '+find(GFX,s.gfx).n}[s.pers]}
function panel(){
  if(s.done)return`<h2>Order placed</h2><p class=sub>Order ${s.ord} for ${s.qty} pair${s.qty>1?'s':''}. Total ${money(price().total)}.</p>
   <ol class=trk><li class=d><div>Order received<small>Confirmation sent to your email</small></div></li>
   <li class=n><div>Artwork approval<small>${s.pers=='none'?'No artwork to approve, production starts next':'Check your email: we send a preview of your strap to approve'}</small></div></li>
   <li><div>Customization<small>Lens and strap made to order, in parallel</small></div></li>
   <li><div>Shipping<small>Sent directly from our plant in Czechia</small></div></li>
   <li><div>Delivered</div></li></ol><div class=bar><span></span><button class=btn id=again>Design another pair</button></div>`;
  if(s.step==0)return`<h2>Choose your base</h2><p class=sub>Bases are built ahead of time. Your personalization is made to order on top.</p>
   <h3>Model</h3><div class=models>${Object.entries(BASE).map(([id,b])=>`<button class="mod${id==s.base?' on':''}" data-k=base data-v=${id}><b>${b.n}</b><span>${b.d}</span><em>from ${money(b.p)}</em></button>`).join('')}</div>
   <h3>Size</h3>${seg('size',SIZES,s.size)}<h3>${frameLbl()}</h3>${sw('frame',FRAME,s.frame)}
   <h3>Included in every pair</h3><ul class=inc><li>Anti-fog coating</li><li>Scratch-resistant hard coat</li><li>Multi-layer ventilation</li><li>Magnetic lens interface</li></ul>`;
  if(s.step==1)return`<h2>Make it yours</h2><p class=sub>Every change updates your preview and price.</p>
   <h3>Lens tint</h3>${sw('tint',TINT,s.tint)}<h3>Lens finish</h3>${seg('fin',FIN,s.fin)}<h3>Strap color</h3>${sw('strap',STRAP,s.strap)}
   <h3>Strap personalization</h3>${seg('pers',PERS,s.pers)}
   ${s.pers=='company'||s.pers=='name'?`<input class=in id=txt maxlength=${s.pers=='name'?14:20} placeholder="${s.pers=='name'?'Your name':'Company name'}" value="${esc(s.text)}" aria-label="Strap text">`:''}
   ${s.pers=='logo'?`<label class=file>Upload your logo (PNG, SVG or JPG)<input type=file id=lg accept="image/*"></label>`:''}
   ${s.pers=='graphic'?`<div style="margin-top:12px">${seg('gfx',GFX,s.gfx)}</div>`:''}
   ${s.pers!='none'?'<p class=hint>Our team checks your artwork before production starts.</p>':''}`;
  const P=price();
  return`<h2>Review your goggles</h2><p class=sub>Check the details before placing your order.</p>
   <dl><div><dt>Base</dt><dd>${BASE[s.base].n}, size ${s.size}</dd></div><div><dt>${frameLbl()}</dt><dd>${find(FRAME,s.frame).n}</dd></div>
   <div><dt>Lens</dt><dd>${find(TINT,s.tint).n}, ${find(FIN,s.fin).n.toLowerCase()}</dd></div><div><dt>Strap color</dt><dd>${find(STRAP,s.strap).n}</dd></div>
   <div><dt>Personalization</dt><dd>${persVal()}</dd></div></dl>
   <h3>Quantity</h3><div class=qty><button data-q=-1 aria-label="Less">&minus;</button><b>${s.qty}</b><button data-q=1 aria-label="More">+</button></div>
   ${s.qty>=10?'<span class=tag>10 or more pairs: ask us for a B2B quote for clubs, schools and resorts</span>':''}
   <input class=in id=em type=email placeholder="Email for your order confirmation" aria-label="Email">
   <div class=note>Production starts once your strap artwork is approved. Pairs ship directly from our plant in Czechia, estimated delivery 5 to 8 working days.</div>`}
function render(){
  $('#nav').innerHTML=['Base','Customize','Review'].map((n,i)=>`<button class="st${s.done||i<s.step?' ok':''}${!s.done&&i==s.step?' on':''}" data-step=${i}><b>${s.done||i<s.step?'\u2713':i+1}</b><span>${n}</span></button>`).join('');
  const bar=s.done?'':`<div class=bar><div><small>Total</small><b class=tv></b></div><div>${s.step?'<button class=btn data-go=-1>Back</button> ':''}${s.step<2?`<button class="btn p" data-go=1>${s.step?'Review order':'Continue'}</button>`:'<button class="btn p" id=order>Place order</button>'}</div></div>`;
  $('#panel').innerHTML=panel()+bar;update()}
/* ---------- Events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.k){s[d.k]=d.v;if(d.k=='pers')s.text='';render()}
  else if(d.go){s.step=Math.max(0,Math.min(2,s.step+ +d.go));render();scrollTo(0,0)}
  else if(d.step){s.step=+d.step;s.done=false;render()}
  else if(d.q){s.qty=Math.max(1,Math.min(50,s.qty+ +d.q));render()}
  else if(b.id=='order'){const m=$('#em');if(!m.value.includes('@')){m.classList.add('bad');m.focus();return}s.ord='VLT-'+Math.floor(10000+Math.random()*90000);s.done=true;render();scrollTo(0,0)}
  else if(b.id=='again'){s=init();render()}});
document.addEventListener('input',e=>{if(e.target.id=='txt'){s.text=e.target.value;update()}});
document.addEventListener('change',e=>{if(e.target.id=='lg'&&e.target.files[0]){const f=e.target.files[0],r=new FileReader();
  r.onload=()=>{s.logo=r.result;s.logoName=f.name;update()};r.readAsDataURL(f)}});
render();
</script>
</body>
</html>
